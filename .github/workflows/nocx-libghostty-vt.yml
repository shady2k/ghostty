# The fork supplies nocx's pinned six-target static VT archives. This workflow
# exists only on a build branch; the fork's main stays a fast-forward of upstream.
# The source build is the exact unmodified upstream revision pinned below.
name: Build nocx libghostty-vt archives

on:
  push:
    branches:
      - nocx/build-libghostty-vt-*

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_COMMIT: befcdfd2c3a1cb24d9ec886e93c95b2b5daa7028
    steps:
      - name: Check out the exact unmodified upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: ghostty
          persist-credentials: false
      - name: Check out pinned nocx packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shady2k/nocx
          ref: 66517eea4a4e20e3a538ab98414dd4c5675a1731
          path: nocx
          persist-credentials: false
      - name: Install Go from nocx's go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: nocx/go.mod
          cache-dependency-path: nocx/go.sum
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build from unmodified upstream and record the hashes
        shell: bash
        run: |
          set -euo pipefail
          # The workflow branch may have several build-only commits, but the
          # checked-out source is always one exact, unpatched upstream commit.
          cd ghostty
          source_commit="$UPSTREAM_COMMIT"
          test "$(git rev-parse HEAD)" = "$source_commit"
          cd ../nocx
          tag="libghostty-vt-${source_commit:0:12}"
          manifest=third_party/libghostty-vt/MANIFEST.json
          jq --arg commit "$source_commit" --arg tag "$tag" \
            '.upstream.repository = "https://github.com/shady2k/ghostty" |
             .upstream.commit = $commit | .upstream.baseCommit = $commit |
             .upstream.patch = "" | .release.tag = $tag |
             .release.assetURLTemplate = ("https://github.com/shady2k/ghostty/releases/download/" + $tag + "/{asset}")' \
            "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          # Ghostty CI gets Zig 0.16.0 from this source's locked zig-overlay,
          # not the distinct nixpkgs Zig with the same reported version. The
          # latter produced malformed arm64 compiler_rt.o: hashes alone passed.
          zig_out="$(nix build --no-link --print-out-paths --impure \
            --expr 'let f = builtins.getFlake ("path:" + builtins.getEnv "GITHUB_WORKSPACE" + "/ghostty"); in f.inputs.zig.packages.x86_64-linux."0.16.0"')"
          test "$("$zig_out/bin/zig" version)" = "0.16.0"
          nix shell nixpkgs#llvmPackages_21.llvm --command \
            third_party/libghostty-vt/scripts/recipe.sh \
              --zig "$zig_out/bin/zig" \
              --source "$GITHUB_WORKSPACE/ghostty" --update-manifest
          go run ./cmd/vtfetch verify --manifest "$manifest" \
            --dist build/libghostty-vt/dist
          # A verified archive may still be unusable. Link each of the six
          # exact bytes with the same Zig before anyone can download them.
          make vt-verify-link VT_DIST="$PWD/build/libghostty-vt/dist" \
            ZIG="$zig_out/bin/zig"
          echo "pin=$source_commit tag=$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all six verified archives, headers, licenses and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libghostty-vt-six-target-pin
          path: |
            nocx/build/libghostty-vt/dist/*
            nocx/third_party/libghostty-vt/MANIFEST.json
          if-no-files-found: error
          retention-days: 14
